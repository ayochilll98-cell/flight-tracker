<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nearby Flights</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    h1 { color: #333; }
    #flights { margin-top: 20px; }
    .flight { padding: 10px; border-bottom: 1px solid #ccc; }
  </style>
</head>
<body>
  <h1>Nearby Flights</h1>
  <div id="flights">Loading flight data...</div>

  <script>
    async function loadFlights() {
      try {
        // Using your AviationStack API key
        const response = await fetch(
          "http://api.aviationstack.com/v1/flights?access_key=a8de45150ad67644a8d01a71a2594ade"
        );
        const data = await response.json();

        const flightsDiv = document.getElementById("flights");
        flightsDiv.innerHTML = "";

        data.data.slice(0, 10).forEach(flight => {
          const div = document.createElement("div");
          div.className = "flight";
          div.textContent = `${flight.airline.name} ${flight.flight.iata} from ${flight.departure.airport} to ${flight.arrival.airport}`;
          flightsDiv.appendChild(div);
        });
      } catch (err) {
        document.getElementById("flights").textContent = "Error loading flights.";
        console.error(err);
      }
    }

    loadFlights();
  </script>
</body>
</html>
